<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background for maskable safe area (full bleed) -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Subtle inner geometric frame inside safe zone -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#312e81" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>
  <circle cx="256" cy="256" r="176" fill="#1e1b4b" fill-opacity="0.5" stroke="#4338ca" stroke-width="3"/>

  <!-- Golden drop / emblem representing edible oil & commodities -->
  <g filter="url(#glow)">
    <!-- Central Shield / Drop base -->
    <path d="M256 120 C220 180 160 250 160 300 A96 96 0 0 0 352 300 C352 250 292 180 256 120 Z" fill="url(#indigoGrad)"/>
    <!-- Golden core emblem inside -->
    <path d="M256 170 C236 215 195 265 195 300 A61 61 0 0 0 317 300 C317 265 276 215 256 170 Z" fill="url(#goldGrad)" opacity="0.95"/>
    <!-- Stylized "ج" dot / accent -->
    <circle cx="256" cy="305" r="18" fill="#1e1b4b"/>
    <circle cx="256" cy="305" r="10" fill="#fbbf24"/>
  </g>

  <!-- Bottom corporate branding accent lines -->
  <rect x="206" y="385" width="100" height="6" rx="3" fill="#6366f1" opacity="0.8"/>
</svg>
